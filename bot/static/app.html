<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Sud tizimi</title>
<style>
  :root { --bg:#f2f3f5; --card:#fff; --text:#101318; --mut:#6a7280; --line:#e4e7eb; --ink:#101318; --on-ink:#fff; --soft:#f6f7f9; --ok:#1f7a45; --warn:#b26a00; --bad:#b42318; --info:#2456a6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0f12; --card:#16191e; --text:#eceef1; --mut:#97a0ab; --line:#252a31; --ink:#eceef1; --on-ink:#0d0f12; --soft:#1b1f25; --ok:#4cc27d; --warn:#e0a13a; --bad:#f0746a; --info:#7aa7ee; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 14px 8px; }
  .bar { display:flex; gap:8px; align-items:center; }
  .search { flex:1; display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:0 12px; height:44px; min-width:0; }
  .search svg { flex:none; color:var(--mut); }
  .search input { flex:1; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-family:ui-monospace,Menlo,Consolas,monospace; min-width:0; }
  .clear { border:0; background:transparent; color:var(--mut); font-size:20px; line-height:1; padding:4px; display:none; }
  .seg { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:none; }
  .seg button { border:0; background:transparent; color:var(--mut); font:inherit; font-size:12.5px; padding:0 9px; height:42px; }
  .seg button.on { background:var(--ink); color:var(--on-ink); }
  .hint { color:var(--mut); font-size:12px; padding:6px 2px 0; display:flex; justify-content:space-between; gap:8px; }
  main { padding:2px 14px 12px; max-width:720px; margin:0 auto; }
  .top { display:flex; align-items:center; gap:8px; margin:4px 0 10px; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:8px 12px; font:inherit; font-size:14px; }
  .btn.ink { background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
  .btn.sm { padding:5px 10px; font-size:12.5px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 10px; }
  .card h3 { margin:0 0 6px; font-size:12px; font-weight:600; color:var(--mut); letter-spacing:.02em; text-transform:uppercase; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:0 0 10px; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-top:1px solid var(--line); cursor:pointer; }
  .row:first-child { border-top:0; }
  .row:active { background:var(--soft); }
  .grow { flex:1; min-width:0; }
  .key { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; word-break:break-all; }
  .sub { color:var(--mut); font-size:12.5px; }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:2px 8px; color:var(--mut); white-space:nowrap; flex:none; }
  .chev { color:var(--mut); flex:none; }
  .kv { display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-top:1px solid var(--line); }
  .kv:first-of-type { border-top:0; }
  .kv span:first-child { color:var(--mut); flex:none; max-width:42%; }
  .kv span:last-child { text-align:right; word-break:break-word; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:var(--soft); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--mut); }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.info { background:var(--info); } .dot.bad { background:var(--bad); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 10px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .stat b { display:block; font-size:19px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--mut); font-size:11.5px; }
  .tabs { display:flex; gap:6px; margin:0 0 10px; }
  .tabs button { flex:1; border:1px solid var(--line); background:var(--card); color:var(--mut); border-radius:10px; padding:9px; font:inherit; font-size:13.5px; }
  .tabs button.on { background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:5px 12px; font:inherit; font-size:13px; }
  .chip.on { background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
  .tl { position:relative; padding-left:18px; }
  .tl::before { content:""; position:absolute; left:4px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .ev { position:relative; padding:0 0 12px; }
  .ev::before { content:""; position:absolute; left:-18px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--card); border:2px solid var(--mut); }
  .ev.last::before { border-color:var(--ink); background:var(--ink); }
  .ev:last-child { padding-bottom:0; }
  .money { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .more { display:block; width:100%; margin:0 0 10px; }
  .msg { color:var(--mut); text-align:center; padding:30px 12px; }
  .err { color:var(--bad); }
  .sk { height:64px; border-radius:14px; background:linear-gradient(90deg,var(--card),var(--soft),var(--card)); background-size:200% 100%; animation:sk 1.2s linear infinite; margin:0 0 10px; }
  @keyframes sk { to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation:none; } }
  .copy { margin-left:6px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Ish, kvitansiya yoki STIR" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="search" enterkeyhint="search">
      <button class="clear" id="clear" aria-label="Tozalash">×</button>
    </label>
    <div class="seg" id="alpha"><button data-a="lat">Lotin</button><button data-a="cyr">Кирил</button></div>
  </div>
  <div class="hint"><span id="hint"></span><span id="hint2"></span></div>
</header>
<main id="main"></main>
<script>
(function () {
  'use strict';
  // ---- launch data: Telegram puts the signed initData in the URL fragment; every call carries it and the server checks it
  var hash = new URLSearchParams(location.hash.slice(1));
  var initData = hash.get('tgWebAppData') || '';
  try { var th = JSON.parse(hash.get('tgWebAppThemeParams') || '{}'); if (th.bg_color) { var rs = document.documentElement.style; rs.setProperty('--bg', th.secondary_bg_color || th.bg_color); rs.setProperty('--card', th.bg_color); rs.setProperty('--text', th.text_color || '#000'); rs.setProperty('--mut', th.hint_color || '#888'); rs.setProperty('--ink', th.text_color || '#000'); rs.setProperty('--on-ink', th.bg_color); rs.setProperty('--soft', th.secondary_bg_color || th.bg_color); } } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var main = $('main'), q = $('q'), hint = $('hint'), hint2 = $('hint2');

  // ---- alphabet: the courts answer in Cyrillic; Latin (old alphabet) is the default here, as in the app
  var alpha = 'lat'; try { alpha = localStorage.getItem('alpha') || 'lat'; } catch (e) {}
  var MAP = { а:'a',б:'b',в:'v',г:'g',д:'d',ж:'j',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'x',ч:'ch',ш:'sh',э:'e',ў:'oʻ',қ:'q',ғ:'gʻ',ҳ:'h',ё:'yo',ю:'yu',я:'ya',ц:'ts',ъ:'ʼ',ь:'' };
  var CYR = /[Ѐ-ӿ]/;
  function lat(s) {
    if (!CYR.test(s)) return s;
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i], lo = ch.toLowerCase(), l;
      if (lo === 'е') { var p = (s[i - 1] || '').toLowerCase(); l = !p || !/[Ѐ-ӿa-z]/i.test(p) || /[аеёиоуэюяъь]/.test(p) ? 'ye' : 'e'; }
      else if (lo in MAP) { l = MAP[lo]; if (lo === 'с' && (s[i + 1] || '').toLowerCase() === 'ҳ') l += 'ʼ'; }
      else { out += ch; continue; }
      if (ch !== lo) { var n = s[i + 1]; var up = !!n && n === n.toUpperCase() && n !== n.toLowerCase(); l = up ? l.toUpperCase() : l.charAt(0).toUpperCase() + l.slice(1); }
      out += l;
    }
    return out.replace(/\bMCHJ\b/g, 'MChJ');
  }
  function T(s) { s = s == null ? '' : String(s); return alpha === 'lat' ? lat(s) : s; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function E(s) { return esc(T(s)); }
  function num(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function money(n) { return num((Number(n) || 0) / 100) + '\u00a0soʻm'; }
  function dmy(ms) { if (!ms) return '-'; var d = new Date(ms + 5 * 3600000); return ('0' + d.getUTCDate()).slice(-2) + '.' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '.' + d.getUTCFullYear(); }
  function has(v) { return v != null && v !== '' && v !== '-'; }
  function kv(k, v, raw) { return has(v) ? '<div class="kv"><span>' + esc(k) + '</span><span>' + (raw ? v : E(v)) + '</span></div>' : ''; }

  var STATUS = [[/якунланган|tugatil|yakunlan/i, 'ok'], [/иш юритувда|кўриб|jarayon|ish yurit|ko.rib/i, 'info'], [/тўхтатил|to.xtatil|кечиктир/i, 'warn'], [/бекор|рад|bekor|rad/i, 'bad']];
  function pill(text) { var cls = ''; for (var i = 0; i < STATUS.length; i++) if (STATUS[i][0].test(text || '')) { cls = STATUS[i][1]; break; } return '<span class="pill"><span class="dot ' + cls + '"></span>' + E(text) + '</span>'; }
  var BILL = { PAID: ['Toʻlangan', 'ok'], USED: ['Ishlatilgan', 'ok'], CREATED: ['Yaratilgan', 'info'], OVERDUE: ['Muddati oʻtgan', 'bad'], CANCELED: ['Bekor qilingan', 'warn'], CANCELLED: ['Bekor qilingan', 'warn'], EXPIRED: ['Muddati tugagan', 'warn'] };
  function billStatus(st) { var b = BILL[st]; return b ? '<span class="pill"><span class="dot ' + b[1] + '"></span>' + b[0] + '</span>' : '<span class="pill"><span class="dot"></span>' + esc(st) + '</span>'; }
  function billWord(st) { return BILL[st] ? BILL[st][0] : esc(st); }
  var COURT = { civil: 'Fuqarolik', economic: 'Iqtisodiy', administrative: 'Maʼmuriy', criminal: 'Jinoyat' };
  var ICON = { case: '⚖️', bill: '🧾', company: '🏢' };

  if (!initData) { main.innerHTML = '<div class="msg err">Bu sahifa Telegram ichida, botning «Qidiruv» tugmasi orqali ochilishi kerak.</div>'; q.disabled = true; return; }

  function api(path) {
    return fetch(path, { headers: { 'x-init-data': initData } }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'Server javob bermadi (' + r.status + ')' }; }).then(function (j) { if (!j.ok) throw new Error(j.error || 'Xato'); return j; });
    });
  }
  function load(html) { main.innerHTML = html; }
  function skeleton() { load('<div class="sk"></div><div class="sk"></div><div class="sk"></div>'); }
  function fail(e, retry) { load('<div class="msg err">' + esc(e.message) + '</div>' + (retry ? '<button class="btn more" id="retry">Qayta urinish</button>' : '')); if (retry && $('retry')) $('retry').onclick = retry; }

  // ---- navigation: every screen is a history entry, so the phone's back button goes back inside the app
  var view = { t: 'home' }, lastSearch = null;
  function go(v, replace) { view = v; (replace ? history.replaceState : history.pushState).call(history, v, ''); render(); window.scrollTo(0, 0); }
  window.addEventListener('popstate', function (e) { view = e.state || { t: 'home' }; render(); });
  function back() { if (history.length > 1) history.back(); else go({ t: 'home' }, true); }
  function top(extra) { return '<div class="top"><button class="btn" id="back">← Orqaga</button>' + (extra || '') + '</div>'; }
  function wire() { var b = $('back'); if (b) b.onclick = back; }

  function render() {
    wire();
    if (view.t === 'search') return renderSearch(view.q);
    if (view.t === 'case') return openCase(view.key);
    if (view.t === 'bill') return openBill(view.key);
    if (view.t === 'company') return openCompany(view.key, view.tab || 'cases', view);
    renderHome();
  }

  // ---- home
  function renderHome() {
    hint.textContent = ''; hint2.textContent = '';
    skeleton();
    api('/api/companies').then(function (j) {
      var i = j.info || {};
      hint.textContent = i.ready ? num(i.indexed) + ' yozuv · ' + i.companies + ' kompaniya' : 'Zaxira yuklanmoqda…';
      hint2.textContent = i.backupAt ? 'zaxira ' + i.backupAt.slice(0, 10).split('-').reverse().join('.') : '';
      var h = '';
      if (!i.ready) h += '<div class="msg">Zaxira hali yuklanmoqda, bir ozdan soʻng qayta oching.</div>';
      h += '<div class="card"><h3>Qidirish</h3><div class="sub">Ish raqami (<span class="mono">2-1004-2603</span>), kvitansiya raqami (6+ raqam) yoki STIR (3+ raqam) yozing. Natijani bossangiz batafsil maʼlumot ochiladi.</div></div>';
      h += '<div class="list">' + (j.companies || []).map(function (c) {
        return '<div class="row" data-co="' + esc(c.tin) + '"><span class="tag">Kompaniya</span><div class="grow"><div class="key">' + esc(c.tin) + '</div><div class="sub">' + num(c.bills) + ' toʻlov · ' + num(c.found) + ' topilgan ish' + (c.refreshedAt ? ' · ' + dmy(c.refreshedAt) + ' holatiga' : '') + '</div></div><span class="chev">›</span></div>';
      }).join('') + '</div>';
      load(h);
    }).catch(function (e) { fail(e, renderHome); });
  }

  // ---- search
  var timer = 0, seq = 0;
  function renderSearch(v) {
    q.value = v; $('clear').style.display = 'block';
    skeleton(); var mine = ++seq;
    api('/api/search?q=' + encodeURIComponent(v)).then(function (j) {
      if (mine !== seq) return;
      lastSearch = j.hits;
      var i = j.info || {};
      hint.textContent = i.ready ? num(i.indexed) + ' yozuv · ' + i.companies + ' kompaniya' : 'Zaxira yuklanmoqda…';
      if (!j.hits.length) { load('<div class="msg">' + (i.ready ? 'Topilmadi.' : 'Zaxira hali yuklanmoqda, birozdan soʻng qayta urining.') + '</div>'); return; }
      var groups = { company: 'Kompaniyalar', case: 'Ishlar', bill: 'Kvitansiyalar' }, h = '';
      ['company', 'case', 'bill'].forEach(function (k) {
        var xs = j.hits.filter(function (x) { return x.kind === k; });
        if (!xs.length) return;
        h += '<div class="sub" style="margin:6px 4px">' + groups[k] + ' (' + xs.length + (xs.length >= 30 ? '+' : '') + ')</div><div class="list">' + xs.map(function (x) {
          var sub = k === 'company' ? num(x.bills) + ' toʻlov · ' + num(x.found) + ' ish' : k === 'bill' ? (x.caseNumber ? 'ish ' + x.caseNumber + ' · ' : '') + x.year : (COURT[x.court] || x.court) + ' · 20' + x.year;
          return '<div class="row" data-k="' + k + '" data-v="' + esc(x.key) + '"><span style="font-size:18px">' + ICON[k] + '</span><div class="grow"><div class="key">' + esc(x.key) + '</div><div class="sub">' + esc(sub) + '</div></div><span class="chev">›</span></div>';
        }).join('') + '</div>';
      });
      load(h);
    }).catch(function (e) { if (mine === seq) fail(e, function () { renderSearch(v); }); });
  }
  q.addEventListener('input', function () {
    clearTimeout(timer); var v = q.value.trim(); $('clear').style.display = q.value ? 'block' : 'none';
    timer = setTimeout(function () {
      if (v.length < 3) { if (view.t !== 'home') go({ t: 'home' }, true); else if (!v) renderHome(); return; }
      if (view.t === 'search') { view = { t: 'search', q: v }; history.replaceState(view, ''); renderSearch(v); }
      else go({ t: 'search', q: v });
    }, 220);
  });
  $('clear').onclick = function () { q.value = ''; $('clear').style.display = 'none'; if (view.t !== 'home') go({ t: 'home' }, true); q.focus(); };
  $('alpha').addEventListener('click', function (ev) { var a = ev.target.dataset && ev.target.dataset.a; if (!a) return; alpha = a; try { localStorage.setItem('alpha', a); } catch (e) {} paintAlpha(); render(); });
  function paintAlpha() { Array.prototype.forEach.call($('alpha').children, function (b) { b.className = b.dataset.a === alpha ? 'on' : ''; }); }

  // ---- a case: general, parties, hearings and decision per instance, bills
  function instance(title, ins) {
    if (!ins || typeof ins !== 'object') return '';
    var h = '<div class="card"><h3>' + esc(title) + '</h3>';
    h += kv('Sud', ins.court) + kv('Sudya', ins.judge) + kv('Shikoyat qiluvchi', ins.appellant);
    var hs = ins.hearings || [];
    if (hs.length) {
      h += '<div class="tl" style="margin-top:10px">' + hs.map(function (x, i) {
        return '<div class="ev' + (i === hs.length - 1 ? ' last' : '') + '"><div><b class="mono">' + esc(x.date || '') + '</b> ' + esc(x.time || '') + '</div><div>' + pill(x.status) + '</div>' + (has(x.postponementReason) ? '<div class="sub">Sabab: ' + E(x.postponementReason) + '</div>' : '') + (has(x.courtroom) ? '<div class="sub">Zal: ' + E(x.courtroom) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }
    var d = ins.decision;
    if (d && typeof d === 'object') {
      h += '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:6px"><div class="sub">Qaror</div>' + kv('Sana', d.date) + kv('Natija', d.text || d.type) + kv('Undirilgan summa', d.awardedAmount) + kv('Davlat boji', d.stateDutyRecovered) + kv('Ijro sanasi', d.enforcedDate) + kv('Apellyatsiya muddati', d.appealDeadline) + '</div>';
    }
    var docs = ins.documents || [];
    if (docs.length) h += '<div style="margin-top:10px"><div class="sub">Hujjatlar (' + docs.length + ')</div>' + docs.slice(0, 20).map(function (x) { return kv(x.date || x.type || '', x.name || x.title || x.type || '', false); }).join('') + '</div>';
    return h + '</div>';
  }
  function openCase(num_) {
    skeleton(); wire();
    api('/api/case?num=' + encodeURIComponent(num_)).then(function (j) {
      var c = j.case, g = (c.detail && c.detail.general) || null, r = c.row || null, d = c.detail || {}, h = top('<span class="grow"></span><button class="btn sm" id="co">STIR ' + esc(c.tin) + ' ›</button>');
      h += '<div class="card"><div class="key" style="font-size:17px">' + esc(c.num) + '<button class="btn sm copy" id="cp">Nusxa</button></div><div class="sub">' + esc(COURT[c.court] || c.court) + ' · 20' + c.year + ' yilda roʻyxatga olingan</div>';
      var status = (g && g.caseStatus) || (r && r.status);
      if (status) h += '<div style="margin-top:8px">' + pill(status) + '</div>';
      h += '</div>';
      if (g) {
        h += '<div class="card"><h3>Umumiy</h3>' + kv('Turi', g.caseType) + kv('Daʼvo predmeti', g.claimSubject) + kv('Sud', g.court) + kv('Hudud', g.region) + kv('Sudya', g.judge) + kv('Kotib', g.secretary) + kv('Joriy instansiya', ({ first: '1-instansiya', appellate: 'Apellyatsiya', cassation: 'Kassatsiya', inspection: 'Taftish' })[g.currentInstance] || g.currentInstance) + kv('Daʼvo summasi', g.claimAmount) + kv('Davlat boji', g.stateDuty) + kv('Ariza sanasi', g.applicationDate) + kv('Ish qoʻzgatilgan', g.initiatedDate) + kv('Muddat', g.deadlineDate) + '</div>';
        h += '<div class="card"><h3>Tomonlar</h3>' + kv('Daʼvogar', g.plaintiff) + kv('Daʼvogar STIR', g.plaintiffTin) + kv('Javobgar', g.defendant) + kv('Javobgar STIR', g.defendantTin) + kv('Uchinchi shaxs', g.thirdParty) + kv('Vakil', g.representative) + kv('Prokuror', g.prosecutor) + '</div>';
      } else if (r) {
        h += '<div class="card"><h3>Umumiy</h3>' + kv('Sud', r.court) + kv('Daʼvogar', r.plaintiff) + kv('Javobgar', r.defendant) + kv('Holati', r.status) + '</div>';
      } else {
        h += '<div class="card"><div class="sub">Batafsil maʼlumot zaxirada yoʻq: bu ish faqat kvitansiyalar orqali maʼlum. Ilovada kompaniya ishlari yangilanganda zaxiraga tushadi.</div></div>';
      }
      h += instance('1-instansiya', d.firstInstance) + instance('Apellyatsiya', d.appellate) + instance('Kassatsiya', d.cassation) + instance('Taftish', d.inspection);
      var bs = c.bills || [];
      if (bs.length) {
        var tot = bs.reduce(function (a, b) { return a + (Number(b.amount) || 0); }, 0);
        h += '<div class="sub" style="margin:6px 4px">Kvitansiyalar (' + bs.length + ') · jami ' + money(tot) + '</div><div class="list">' + bs.map(function (b) {
          return '<div class="row" data-k="bill" data-v="' + esc(b.number) + '"><span style="font-size:18px">🧾</span><div class="grow"><div class="key">' + esc(b.number) + '</div><div class="sub">' + E(b.cat) + ' · <span class="money">' + money(b.amount) + '</span> · ' + billWord(b.status) + '</div></div><span class="chev">›</span></div>';
        }).join('') + '</div>';
      }
      load(h); wire();
      $('co').onclick = function () { go({ t: 'company', key: c.tin }); };
      $('cp').onclick = function (ev) { ev.stopPropagation(); try { navigator.clipboard.writeText(c.num); ev.target.textContent = 'Nusxalandi'; } catch (e) {} };
    }).catch(function (e) { load(top()); wire(); main.insertAdjacentHTML('beforeend', '<div class="msg err">' + esc(e.message) + '</div>'); });
  }

  // ---- a bill
  function openBill(num_) {
    skeleton();
    api('/api/bill?num=' + encodeURIComponent(num_)).then(function (j) {
      var b = j.bill, h = top();
      h += '<div class="card"><div class="key" style="font-size:17px">' + esc(b.number) + '</div><div class="sub">' + E(b.cat) + '</div><div style="margin-top:8px">' + billStatus(b.status) + '</div></div>';
      h += '<div class="card"><h3>Summa</h3>' + kv('Summa', '<span class="money">' + money(b.amount) + '</span>', true) + kv('Toʻlangan', '<span class="money">' + money(b.paid) + '</span>', true) + kv('Qoldiq', '<span class="money">' + money(b.balance) + '</span>', true) + kv('Toʻlanishi kerak', '<span class="money">' + money(b.mustPay) + '</span>', true) + kv('Berilgan', dmy(b.issued)) + kv('Muddat', dmy(b.overdue)) + '</div>';
      h += '<div class="card"><h3>Tafsilot</h3>' + kv('Sud', b.court) + kv('Toʻlovchi', b.payer) + kv('Toʻlovchi STIR', b.payerTin) + kv('STIR', b.tin) + '</div>';
      if (has(b.caseNumber)) h += '<div class="list"><div class="row" data-k="case" data-v="' + esc(b.caseNumber) + '"><span style="font-size:18px">⚖️</span><div class="grow"><div class="sub">Ish</div><div class="key">' + esc(b.caseNumber) + '</div></div><span class="chev">›</span></div></div>';
      load(h); wire();
    }).catch(function (e) { load(top()); wire(); main.insertAdjacentHTML('beforeend', '<div class="msg err">' + esc(e.message) + '</div>'); });
  }

  // ---- a company: numbers, then its cases (searchable, by court) or its bills (by year, searchable), paged
  function openCompany(tin, tab, st) {
    st = st || {}; skeleton();
    api('/api/company?tin=' + encodeURIComponent(tin)).then(function (j) {
      var c = j.company, years = (c.years || []).slice().sort().reverse();
      var year = st.year || years[0] || '', court = st.court || '', qq = st.q || '';
      var h = top();
      h += '<div class="card"><div class="key" style="font-size:17px">' + esc(c.tin) + '</div><div class="sub">' + (c.firstAt ? 'Birinchi yuklash: ' + dmy(c.firstAt) : '') + (c.firstAt && c.refreshedAt ? ' · ' : '') + (c.refreshedAt ? 'maʼlumot ' + dmy(c.refreshedAt) + ' holatiga' : '') + (!c.firstAt && !c.refreshedAt ? 'Zaxiradagi kompaniya' : '') + '</div></div>';
      h += '<div class="stats"><div class="stat"><b>' + num(c.bills) + '</b><span>toʻlov</span></div><div class="stat"><b>' + num(c.found) + '</b><span>topilgan ish</span></div><div class="stat"><b>' + years.length + '</b><span>yil</span></div></div>';
      h += '<div class="tabs"><button data-tab="cases" class="' + (tab === 'cases' ? 'on' : '') + '">Ishlar</button><button data-tab="bills" class="' + (tab === 'bills' ? 'on' : '') + '">Kvitansiyalar</button></div>';
      h += '<div id="sub"></div>';
      load(h); wire();
      Array.prototype.forEach.call(main.querySelectorAll('[data-tab]'), function (b) { b.onclick = function () { go({ t: 'company', key: tin, tab: b.dataset.tab }, true); }; });
      var sub = $('sub');
      if (tab === 'cases') cases(sub, tin, court, qq, 0, true);
      else bills(sub, tin, years, year, qq, 0, true);
    }).catch(function (e) { load(top()); wire(); main.insertAdjacentHTML('beforeend', '<div class="msg err">' + esc(e.message) + '</div>'); });
  }
  function box(sub, ph, val, cb) {
    var h = '<label class="search" style="margin:0 0 10px;height:40px"><input id="sq" placeholder="' + esc(ph) + '" value="' + esc(val) + '" autocomplete="off" spellcheck="false" inputmode="search"></label>';
    sub.insertAdjacentHTML('afterbegin', h); var t = 0; var i = $('sq'); i.oninput = function () { clearTimeout(t); t = setTimeout(function () { cb(i.value); }, 300); };
  }
  function cases(sub, tin, court, qq, offset, fresh) {
    var url = '/api/company/cases?tin=' + tin + '&court=' + encodeURIComponent(court) + '&q=' + encodeURIComponent(qq) + '&offset=' + offset + '&limit=30';
    api(url).then(function (j) {
      var c = j.cases;
      if (fresh) {
        var chips = '<div class="chips"><button class="chip' + (court ? '' : ' on') + '" data-c="">Hammasi</button>' + Object.keys(c.courts).map(function (k) { return '<button class="chip' + (court === k ? ' on' : '') + '" data-c="' + k + '">' + (COURT[k] || k || '—') + ' ' + num(c.courts[k]) + '</button>'; }).join('') + '</div><div id="rows"></div>';
        sub.innerHTML = chips; box(sub, 'Ish raqami boʻyicha filtr…', qq, function (v) { go({ t: 'company', key: tin, tab: 'cases', court: court, q: v }, true); });
        Array.prototype.forEach.call(sub.querySelectorAll('[data-c]'), function (b) { b.onclick = function () { go({ t: 'company', key: tin, tab: 'cases', court: b.dataset.c, q: qq }, true); }; });
      }
      var rows = $('rows');
      if (!c.rows.length && fresh) { rows.innerHTML = '<div class="msg">Ish topilmadi.</div>'; return; }
      var html = (fresh ? '<div class="sub" style="margin:2px 4px 6px">' + num(c.total) + ' ta ish</div><div class="list" id="cl">' : '') + c.rows.map(function (x) {
        return '<div class="row" data-k="case" data-v="' + esc(x.key) + '"><span style="font-size:18px">⚖️</span><div class="grow"><div class="key">' + esc(x.key) + '</div><div class="sub">' + (COURT[x.court] || x.court) + ' · 20' + x.year + '</div></div><span class="chev">›</span></div>';
      }).join('') + (fresh ? '</div><div id="mm"></div>' : '');
      if (fresh) rows.innerHTML = html; else $('cl').insertAdjacentHTML('beforeend', html);
      $('mm').innerHTML = offset + c.rows.length < c.total ? '<button class="btn more" id="more">Yana ' + Math.min(30, c.total - offset - c.rows.length) + ' ta…</button>' : '';
      if ($('more')) $('more').onclick = function () { cases(sub, tin, court, qq, offset + 30, false); };
    }).catch(function (e) { sub.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
  }
  function bills(sub, tin, years, year, qq, offset, fresh) {
    if (!year) { sub.innerHTML = '<div class="msg">Kvitansiyalar zaxirada yoʻq.</div>'; return; }
    api('/api/company/bills?tin=' + tin + '&year=' + year + '&q=' + encodeURIComponent(qq) + '&offset=' + offset + '&limit=30').then(function (j) {
      var b = j.bills;
      if (fresh) {
        sub.innerHTML = '<div class="chips">' + years.map(function (y) { return '<button class="chip' + (String(y) === String(year) ? ' on' : '') + '" data-y="' + y + '">' + y + '</button>'; }).join('') + '</div><div id="rows"></div>';
        box(sub, 'Kvitansiya yoki ish raqami, sud…', qq, function (v) { go({ t: 'company', key: tin, tab: 'bills', year: year, q: v }, true); });
        Array.prototype.forEach.call(sub.querySelectorAll('[data-y]'), function (x) { x.onclick = function () { go({ t: 'company', key: tin, tab: 'bills', year: x.dataset.y, q: qq }, true); }; });
      }
      var rows = $('rows');
      if (!b.rows.length && fresh) { rows.innerHTML = '<div class="msg">Kvitansiya topilmadi.</div>'; return; }
      var html = (fresh ? '<div class="sub" style="margin:2px 4px 6px">' + num(b.total) + ' ta · jami <span class="money">' + money(b.sum) + '</span> · toʻlangan <span class="money">' + money(b.paid) + '</span></div><div class="list" id="bl">' : '') + b.rows.map(function (x) {
        return '<div class="row" data-k="bill" data-v="' + esc(x.number) + '"><span style="font-size:18px">🧾</span><div class="grow"><div class="key">' + esc(x.number) + '</div><div class="sub">' + E(x.cat) + ' · <span class="money">' + money(x.amount) + '</span> · ' + esc(x.status) + ' · ' + dmy(x.issued) + (has(x.caseNumber) ? '<br>ish ' + esc(x.caseNumber) : '') + '</div></div><span class="chev">›</span></div>';
      }).join('') + (fresh ? '</div><div id="mm"></div>' : '');
      if (fresh) rows.innerHTML = html; else $('bl').insertAdjacentHTML('beforeend', html);
      $('mm').innerHTML = offset + b.rows.length < b.total ? '<button class="btn more" id="more">Yana ' + Math.min(30, b.total - offset - b.rows.length) + ' ta…</button>' : '';
      if ($('more')) $('more').onclick = function () { bills(sub, tin, years, year, qq, offset + 30, false); };
    }).catch(function (e) { sub.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
  }

  // ---- clicks (rows everywhere)
  main.addEventListener('click', function (ev) {
    var t = ev.target; while (t && t !== main && !(t.dataset && (t.dataset.k || t.dataset.co))) t = t.parentNode;
    if (!t || t === main) return;
    if (t.dataset.co) return go({ t: 'company', key: t.dataset.co });
    go({ t: t.dataset.k, key: t.dataset.v });
  });

  paintAlpha();
  // opened from a chat button: /app?case=…  /app?bill=…  /app?company=…
  var sp = new URLSearchParams(location.search), first = { t: 'home' };
  if (sp.get('case')) first = { t: 'case', key: sp.get('case') }; else if (sp.get('bill')) first = { t: 'bill', key: sp.get('bill') }; else if (sp.get('company')) first = { t: 'company', key: sp.get('company') };
  view = first; history.replaceState(first, ''); render();
})();
</script>
</body>
</html>
